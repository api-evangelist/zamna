name: Zamna
description: >-
  Zamna is a GDPR-compliant digital identity and passenger-data verification
  platform for the aviation and travel industry, used by airlines, airports,
  ground handlers and governments to verify passport, visa and health documents
  before a traveler reaches the airport. Its Ready To Fly (PaxCheck) API stitches
  passenger sessions, document recognition and consent capture into airline
  systems, while the Checklist API resolves live travel rules into localized,
  per-passenger requirements and a pluggable WebView drives the MMB/OLCI flows.
  Zamna has verified over 60 million travel identities across 179+ countries and
  integrates with airline PSS/DCS platforms such as Amadeus Altea, Navitaire and
  Sabre.
